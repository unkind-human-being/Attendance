<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- 1. Lock the zoom and fit the screen perfectly (handles notches) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- 2. Force iOS Safari into Standalone App Mode (Hides URL Bar) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Smart PTA" />
    
    <!-- 3. Force Android Chrome into Standalone App Mode -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1877f2" />

    <title>Smart PTA</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
